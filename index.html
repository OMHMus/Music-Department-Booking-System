<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Practice Rooms</title>
<style>
:root{--bg:#eef1f6;--ink:#1d2433;--mut:#5b6478;--acc:#0f766e;--bad:#b42318;--card:#fff;--line:#d5dae4;--mine:#c7e9e4;--shut:#e4e6ec}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--ink);color:#fff;padding:.7rem 1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
header h1{font-size:1.1rem;margin:0;flex:1}main{max-width:62rem;margin:0 auto;padding:1rem}
nav{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
button,input,select,textarea{font:inherit}
button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:.45rem .9rem;cursor:pointer}
button.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}button.on{background:var(--ink);color:#fff}
button.bad{background:var(--bad)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f59e0b;outline-offset:1px}
input,select,textarea{padding:.4rem .5rem;border:1px solid var(--line);border-radius:6px;background:#fff;max-width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1rem;margin-bottom:1rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end}label{display:flex;flex-direction:column;font-size:.9rem;gap:.2rem}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--line);padding:.4rem;text-align:center;font-size:.9rem}
td button{width:100%;background:#fff;color:var(--acc);border:1px solid var(--acc)}td.mine{background:var(--mine)}td.shut,td.full{background:var(--shut);color:var(--mut)}
td.sel button{background:var(--acc);color:#fff}
#msg{padding:.6rem 1rem;border-radius:6px;margin-bottom:1rem;display:none}#msg.ok{display:block;background:#d9f2e6}#msg.err{display:block;background:#fde4e1;color:var(--bad)}
.mut{color:var(--mut);font-size:.9rem}li{margin:.3rem 0}.item{display:flex;gap:.6rem;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:.5rem 0;border-bottom:1px solid var(--line)}
</style></head><body>
<header><h1>Music Practice Rooms</h1><span id="who"></span><button class="alt" id="out" hidden>Log out</button></header>
<main><div id="msg" role="status"></div><div id="app">Loading…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Publishable (anon) key ONLY. Never put a service-role/secret key here.
const SB_URL='https://cukylemtaiogtfnwuwgq.supabase.co', SB_KEY='sb_publishable_u0vyX_4O8UIEHhSm-f3wmg_oT8bNymk';
const sb=supabase.createClient(SB_URL,SB_KEY);
// Only school email addresses may create an account (also enforced in the database by a trigger on auth.users).
const SCHOOL_DOMAIN='@sexeys.somerset.sch.uk';
const isSchoolEmail=e=>String(e||'').trim().toLowerCase().endsWith(SCHOOL_DOMAIN);
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SESS={break:'Break 11:05–11:25',lunch:'Lunch 12:25–13:15'}, DAYS=['','Mon','Tue','Wed','Thu','Fri'];
let me=null, tab='book', sel=null, date=iso(new Date());
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function flash(t,bad){const m=$('#msg');m.textContent=t||'';m.className=t?(bad?'err':'ok'):''}
const q=r=>{if(r.error)throw r.error;return r.data};
const fail=e=>flash(e.message||String(e),true);
const wdOf=d=>(new Date(d+'T12:00').getDay()+6)%7+1;

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){me=null;$('#out').hidden=true;$('#who').textContent='';return authView()}
  try{me=q(await sb.from('profiles').select('*').eq('id',session.user.id).single())}catch(e){return fail(e)}
  $('#out').hidden=false;$('#who').textContent=me.full_name+(me.role==='staff'?' (staff)':'');
  if(me.role!=='staff'){
    if(!me.registered)return regView();
    if(me.rejected)return app.innerHTML='<div class="card"><h2>Registration not approved</h2><p>Please speak to a member of the Music Department.</p></div>';
    if(!me.approved)return app.innerHTML='<div class="card"><h2>Waiting for approval</h2><p>Your registration has been sent. You can book once staff approve it.</p></div>';
  }
  shell();
}
function shell(){
  const tabs=[['book','Book'],['mine','My bookings']];
  if(me.role==='staff')tabs.push(['regs','Registrations'],['all','All bookings'],['rules','Closures']);
  app.innerHTML=`<nav>${tabs.map(t=>`<button class="${t[0]===tab?'on':'alt'}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</nav><div id="view"></div>`;
  ({book:bookView,mine:mineView,regs:regsView,all:allView,rules:rulesView})[tab]().catch(fail);
}
function authView(){
  app.innerHTML=`<div class="card"><h2>Log in</h2><form id="f-login" class="row"><label>Email<input name="email" type="email" required autocomplete="username"></label>
  <label>Password<input name="pw" type="password" required autocomplete="current-password"></label><button>Log in</button></form></div>
  <div class="card"><h2>New pupil? Create an account</h2><form id="f-signup" class="row"><label>Full name<input name="name" required></label>
  <label>School email (must end ${SCHOOL_DOMAIN})<input name="email" type="email" required placeholder="name${SCHOOL_DOMAIN}" pattern=".+@sexeys\.somerset\.sch\.uk" title="Use your ${SCHOOL_DOMAIN} school email address"></label><label>Password (8+ characters)<input name="pw" type="password" minlength="8" required autocomplete="new-password"></label><button>Create account</button></form>
  <p class="mut">After creating an account you will complete your induction, agree to the Practice Room Agreement and register, then wait for staff approval.</p></div>`;
}
function regView(){
  app.innerHTML=`<div class="card"><h2>Register to use the practice rooms</h2><form id="f-reg">
  <p><label><span><input type="checkbox" name="ind" required> I have completed the Music Department induction</span></label></p>
  <p><label><span><input type="checkbox" name="agr" required> I agree to the Practice Room Agreement</span></label></p>
  <div class="row"><label>Registering as<select name="type" id="rt"><option value="individual">Individual</option><option value="band">Band</option></select></label>
  <label>Year group<input name="year" type="number" min="7" max="13" required></label><label>Your instrument(s)<input name="inst" required></label></div>
  <div id="bandbox" hidden><div class="row"><label>Band name<input name="band"></label></div>
  <p class="mut">Other members, one per line as: Name, Instrument. You are the lead pupil.</p><textarea name="members" rows="4" cols="40"></textarea></div>
  <p><button>Send registration</button></p></form></div>`;
}
async function bookView(){
  const v=$('#view'),wd=wdOf(date);
  const [res,wk,cl,sl,bands]=await Promise.all([sb.from('resources').select('*').order('sort'),sb.from('weekly_closures').select('*'),
    sb.from('closures').select('*').eq('closure_date',date),sb.rpc('get_slots',{d1:date,d2:date}),sb.from('bands').select('id,name').eq('lead_id',me.id)]);
  const R=q(res),W=q(wk),C=q(cl),S=q(sl),B=q(bands),max=new Date();max.setDate(max.getDate()+28);
  const shut=(r,s)=>{const w=W.find(w=>(!w.resource_id||w.resource_id===r.id)&&w.weekday===wd&&(!w.session||w.session===s));
    const c=C.find(c=>(!c.resource_id||c.resource_id===r.id)&&(!c.session||c.session===s));return w?'Closed':c?(c.reason||'Closed'):null};
  const cell=(r,s)=>{const x=shut(r,s);if(wd>5)return'<td class="shut">Weekend</td>';if(x)return`<td class="shut">${esc(x)}</td>`;
    const u=S.filter(b=>b.resource_id===r.id&&b.session===s),n=u.reduce((a,b)=>a+b.seats,0);
    if(r.id==='computers')return n>=r.capacity?'<td class="full">Full</td>':`<td class="${sel&&sel.r===r.id&&sel.s===s?'sel':''}"><button data-pick="${r.id}|${s}">${r.capacity-n} free</button></td>`;
    if(u.length)return u[0].mine?'<td class="mine">Yours</td>':'<td class="full">Booked</td>';
    return`<td class="${sel&&sel.r===r.id&&sel.s===s?'sel':''}"><button data-pick="${r.id}|${s}">Book</button></td>`};
  v.innerHTML=`<div class="card"><label>Date<input type="date" id="d" value="${date}" min="${iso(new Date())}" max="${iso(max)}"></label></div>
  <div class="card scroll"><table><tr><th>Space</th>${Object.values(SESS).map(s=>`<th>${s}</th>`).join('')}</tr>
  ${R.map(r=>`<tr><th scope="row">${esc(r.name)}</th>${cell(r,'break')}${cell(r,'lunch')}</tr>`).join('')}</table></div>
  ${sel?`<div class="card"><h3>Confirm: ${esc(R.find(r=>r.id===sel.r).name)}, ${date}, ${SESS[sel.s]}</h3><form id="f-book" class="row">
   ${sel.r==='computers'?`<label>Places<input name="seats" type="number" min="1" max="16" value="1"></label><label>Purpose (required)<input name="purpose" required minlength="5" placeholder="e.g. GCSE composition coursework"></label>`:''}
   ${B.length?`<label>Band (optional)<select name="band"><option value="">Just me</option>${B.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></label>`:''}
   <button>Confirm booking</button></form></div>`:''}`;
}
async function mineView(){
  const D=q(await sb.from('bookings').select('*,resources(name)').eq('user_id',me.id).gte('booking_date',iso(new Date())).order('booking_date'));
  $('#view').innerHTML=`<div class="card"><h2>My upcoming bookings</h2>${D.length?D.map(b=>`<div class="item"><span>${b.booking_date} · ${SESS[b.session]} · ${esc(b.resources.name)}${b.resource_id==='computers'?` (${b.seats} place${b.seats>1?'s':''}: ${esc(b.purpose)})`:''}</span><button class="bad" data-cancel="${b.id}">Cancel</button></div>`).join(''):'<p class="mut">Nothing booked yet.</p>'}</div>`;
}
async function allView(){
  const D=q(await sb.from('bookings').select('*,resources(name),profiles(full_name),bands(name)').gte('booking_date',iso(new Date())).order('booking_date'));
  $('#view').innerHTML=`<div class="card"><h2>All upcoming bookings</h2>${D.length?D.map(b=>`<div class="item"><span>${b.booking_date} · ${SESS[b.session]} · ${esc(b.resources.name)} · ${esc(b.profiles?.full_name)}${b.bands?' ('+esc(b.bands.name)+')':''}${b.purpose?' · '+esc(b.purpose):''}</span><button class="bad" data-cancel="${b.id}">Cancel</button></div>`).join(''):'<p class="mut">No bookings.</p>'}</div>`;
}
async function regsView(){
  const P=q(await sb.from('profiles').select('*,bands(name,band_members(member_name,instrument))').eq('role','pupil').eq('registered',true).order('created_at',{ascending:false}));
  const row=p=>`<div class="item"><span><b>${esc(p.full_name)}</b> · Y${p.year_group} · ${esc(p.instruments)} · ${p.reg_type}${p.bands?.length?' — '+p.bands.map(b=>esc(b.name)+': '+b.band_members.map(m=>esc(m.member_name)+' ('+esc(m.instrument)+')').join(', ')).join('; '):''}</span>
   <span>${p.approved?`<button class="alt" data-appr="${p.id}|0">Revoke</button>`:`<button data-appr="${p.id}|1">Approve</button> <button class="bad" data-rej="${p.id}">Reject</button>`}</span></div>`;
  const pend=P.filter(p=>!p.approved&&!p.rejected),ok=P.filter(p=>p.approved),rej=P.filter(p=>p.rejected);
  $('#view').innerHTML=`<div class="card"><h2>Awaiting approval (${pend.length})</h2>${pend.map(row).join('')||'<p class="mut">None.</p>'}</div>
  <div class="card"><h2>Approved (${ok.length})</h2>${ok.map(row).join('')||'<p class="mut">None.</p>'}</div>
  <div class="card"><h2>Rejected (${rej.length})</h2>${rej.map(p=>row(p).replace(/<button data-rej.*?<\/button>/,'')).join('')||'<p class="mut">None.</p>'}</div>`;
}
async function rulesView(){
  const [r,w,c]=await Promise.all([sb.from('resources').select('id,name').order('sort'),sb.from('weekly_closures').select('*').order('weekday'),sb.from('closures').select('*').order('closure_date')]);
  const R=q(r),W=q(w),C=q(c),nm=id=>id?R.find(x=>x.id===id)?.name:'Whole department';
  const opts='<option value="">Whole department</option>'+R.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
  const ses='<option value="">All day</option><option value="break">Break</option><option value="lunch">Lunch</option>';
  $('#view').innerHTML=`<div class="card"><h2>Exceptional closures</h2><form id="f-clo" class="row"><label>Space<select name="r">${opts}</select></label>
  <label>Date<input type="date" name="d" required></label><label>Session<select name="s">${ses}</select></label><label>Reason<input name="why"></label><button>Add closure</button></form>
  ${C.map(x=>`<div class="item"><span>${x.closure_date} · ${esc(nm(x.resource_id))} · ${x.session||'All day'} · ${esc(x.reason)}</span><button class="bad" data-delc="${x.id}">Remove</button></div>`).join('')}</div>
  <div class="card"><h2>Weekly closures</h2><form id="f-wk" class="row"><label>Space<select name="r">${opts}</select></label>
  <label>Day<select name="wd">${[1,2,3,4,5].map(i=>`<option value="${i}">${DAYS[i]}</option>`).join('')}</select></label><label>Session<select name="s">${ses}</select></label><button>Add rule</button></form>
  ${W.map(x=>`<div class="item"><span>${esc(nm(x.resource_id))} · ${DAYS[x.weekday]} · ${x.session||'All day'}</span><button class="bad" data-delw="${x.id}">Remove</button></div>`).join('')}</div>`;
}

document.addEventListener('submit',async e=>{
  e.preventDefault();const id=e.target.id,f=Object.fromEntries(new FormData(e.target));flash('');
  try{
    if(id==='f-login'){q(await sb.auth.signInWithPassword({email:f.email,password:f.pw}));boot()}
    else if(id==='f-signup'){
      if(!isSchoolEmail(f.email))throw new Error('Accounts can only be created with a '+SCHOOL_DOMAIN+' email address.');
      const r=q(await sb.auth.signUp({email:f.email.trim(),password:f.pw,options:{data:{full_name:f.name.trim()}}}));
      if(r.session)boot();else flash('Account created. Check your email to confirm it, then log in.')}
    else if(id==='f-reg'){
      let bandId=null;
      if(f.type==='band'){if(!f.band?.trim())throw new Error('Enter a band name');
        bandId=q(await sb.from('bands').insert({name:f.band.trim(),lead_id:me.id}).select().single()).id;
        const ms=(f.members||'').split('\n').map(l=>l.split(',')).filter(a=>a[0].trim()).map(a=>({band_id:bandId,member_name:a[0].trim(),instrument:(a[1]||'').trim()}));
        ms.push({band_id:bandId,member_name:me.full_name+' (lead)',instrument:f.inst});
        q(await sb.from('band_members').insert(ms))}
      q(await sb.from('profiles').update({registered:true,reg_type:f.type,year_group:+f.year,instruments:f.inst,induction_done:true,agreement_signed:true}).eq('id',me.id));
      boot()}
    else if(id==='f-book'){
      const R=sel.r;q(await sb.from('bookings').insert({resource_id:R,booking_date:date,session:sel.s,user_id:me.id,
        seats:R==='computers'?+f.seats:1,purpose:R==='computers'?f.purpose.trim():null,band_id:f.band?+f.band:null}));
      sel=null;flash('Booked.');bookView()}
    else if(id==='f-clo'){q(await sb.from('closures').insert({resource_id:f.r||null,closure_date:f.d,session:f.s||null,reason:f.why}));rulesView()}
    else if(id==='f-wk'){q(await sb.from('weekly_closures').insert({resource_id:f.r||null,weekday:+f.wd,session:f.s||null}));rulesView()}
  }catch(err){fail(err)}
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;flash('');
  try{
    if(d.tab){tab=d.tab;sel=null;shell()}
    else if(d.pick){const[r,s]=d.pick.split('|');sel={r,s};bookView()}
    else if(d.cancel){if(confirm('Cancel this booking?')){q(await sb.from('bookings').delete().eq('id',d.cancel));flash('Booking cancelled.');shell()}}
    else if(d.appr){const[i,v]=d.appr.split('|');q(await sb.from('profiles').update({approved:v==='1',rejected:false}).eq('id',i));regsView()}
    else if(d.rej){q(await sb.from('profiles').update({rejected:true,approved:false}).eq('id',d.rej));regsView()}
    else if(d.delc){q(await sb.from('closures').delete().eq('id',d.delc));rulesView()}
    else if(d.delw){q(await sb.from('weekly_closures').delete().eq('id',d.delw));rulesView()}
  }catch(err){fail(err)}
});
document.addEventListener('change',e=>{
  if(e.target.id==='d'){date=e.target.value||date;sel=null;bookView().catch(fail)}
  if(e.target.id==='rt')$('#bandbox').hidden=e.target.value!=='band';
});
$('#out').onclick=async()=>{await sb.auth.signOut();tab='book';boot()};
boot();
</script></body></html>
