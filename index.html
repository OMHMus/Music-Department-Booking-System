<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sexey's Practice Rooms</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="theme-color" content="#8B292B">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Sexey's School branding: maroon #8B292B and gold #C8A877, Cinzel headings (close to the wordmark), Montserrat UI. */
:root{
  --bg:#F6F3EF;--card:#FFFFFF;--ink:#2B1B1C;--mut:#6F5E5D;--line:#E4DAD1;
  --maroon:#8B292B;--maroon-deep:#6E1F21;--gold:#C8A877;--gold-ink:#86672F;--acc-text:#8B292B;
  --shut:#EEE8E2;--shut-ink:#857774;--soft:#F4ECDD;--ok-bg:#E3F1E7;--ok-ink:#25573A;--bad:#A3271F;--bad-bg:#FBE5E2;
  --paper:#FFFFFF;--shadow:0 1px 2px rgba(60,20,20,.06),0 6px 20px rgba(60,20,20,.06);
  --f-display:"Cinzel","Trajan Pro",Georgia,serif;--f-ui:"Montserrat","Gotham","Helvetica Neue",Arial,sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root{
  --bg:#170F10;--card:#221819;--ink:#F2EAE4;--mut:#B5A5A1;--line:#3A2B2C;--gold-ink:#D9BE8C;--acc-text:#E6A79F;
  --shut:#2C2122;--shut-ink:#9C8B88;--soft:#33291C;--ok-bg:#1E3527;--ok-ink:#9AD8B0;--bad:#C7463C;--bad-bg:#3A1C1A;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 var(--f-ui);background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:66rem;margin:0 auto;padding-inline:16px}

/* Brand bar + maroon band */
.brand{background:var(--paper);border-bottom:3px solid var(--gold)}
.brand .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;padding-block:12px;flex-wrap:wrap}
.lockup{display:flex;align-items:center;gap:14px;text-decoration:none}
.lockup .crest{height:58px;width:auto}.lockup .wm{height:42px;width:auto}
.acct{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:#2B1B1C;font-size:14px}
.acct #who{font-weight:600}
.acct button{background:#fff;color:#8B292B;border:1.5px solid #C8A877}
.acct button:hover{background:#F4ECDD}
.band{background:linear-gradient(180deg,var(--maroon),var(--maroon-deep));color:#fff}
.band .wrap{padding-block:20px}
.band .eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#E9D6B3;font-weight:600}
.band h1{font-family:var(--f-display);font-weight:600;font-size:clamp(24px,4vw,32px);margin:2px 0 0;letter-spacing:.02em;text-wrap:balance}
main.wrap{padding-block:22px 48px}

/* Controls */
button{background:var(--maroon);color:#fff;border:1.5px solid transparent;border-radius:999px;padding:.5rem 1.1rem;cursor:pointer;font-weight:600;font-size:14px}
button:hover{background:var(--maroon-deep)}
button:disabled{opacity:.6;cursor:progress}
button.alt{background:var(--card);color:var(--ink);border-color:var(--line)}
button.alt:hover{border-color:var(--gold);background:var(--soft)}
button.bad{background:transparent;color:var(--bad);border-color:var(--bad)}
button.bad:hover{background:var(--bad);color:#fff}
input,select,textarea{padding:.55rem .7rem;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(200,168,119,.3)}
input[type=checkbox]{accent-color:var(--maroon);width:17px;height:17px;vertical-align:-3px;margin-right:6px}
label{display:flex;flex-direction:column;font-size:13px;font-weight:600;gap:.3rem}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:end}

/* Tabs */
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:12px}
nav button{background:transparent;color:var(--mut);border:1.5px solid transparent}
nav button:hover{background:var(--soft);color:var(--ink)}
nav button.on{background:var(--maroon);color:#fff}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
h2,h3{font-family:var(--f-display);font-weight:600;color:var(--acc-text);margin:0 0 10px;letter-spacing:.02em;text-wrap:balance}
h2{font-size:19px}h3{font-size:16px}
.mut{color:var(--mut);font-size:13.5px}
.item{display:flex;gap:.6rem;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:.7rem 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.item:last-child{border-bottom:0}
.item>span:first-child{min-width:0;flex:1 1 16rem}

#msg{padding:.7rem 1rem;border-radius:10px;margin-bottom:16px;display:none;font-weight:500;border-left:4px solid}
#msg.ok{display:block;background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-ink)}
#msg.err{display:block;background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}

/* Login */
.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.auth .logo{grid-column:1/-1;display:flex;justify-content:center}
.auth .logo img{height:150px;width:auto}
.auth form{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.auth form button{align-self:flex-start}
@media (max-width:720px){.auth{grid-template-columns:minmax(0,1fr)}}

/* Day picker */
.daybar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.daybar .when{font-family:var(--f-display);font-size:20px;font-weight:600;color:var(--acc-text)}
.daybar .ctl{display:flex;align-items:center;gap:8px}
.daybar .ctl button{width:40px;height:40px;padding:0;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mut);margin:-4px 0 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line);display:inline-block}
.sw.free{border-color:var(--gold);background:var(--card)}.sw.mine{background:var(--maroon);border-color:var(--maroon)}.sw.shut{background:var(--shut)}

.quota{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:14px}
.quota .qbar{display:flex;gap:5px}.quota .qbar i{width:28px;height:8px;border-radius:4px;background:var(--shut)}.quota .qbar i.on{background:var(--maroon)}
.quota.quota-full{border-color:var(--gold);background:var(--soft)}
.badge{display:inline-block;background:var(--maroon);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;vertical-align:1px}
.acts{display:flex;align-items:end;gap:10px;flex-wrap:wrap}
.exam{flex-direction:row;align-items:center;gap:8px;font-size:12.5px}
.exam select{padding:.4rem .6rem}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink)}
.pill.wait{background:var(--soft);color:var(--gold-ink)}
.bandcard .bandhd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.bandcard .bandhd h2{margin:0}
.members{list-style:none;margin:0 0 14px;padding:0}
.members li{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:.6rem 0;border-bottom:1px solid var(--line)}
.members .mname{min-width:0;flex:1 1 14rem;overflow-wrap:anywhere}
.btnlink{display:inline-block;border:1.5px solid var(--gold);color:var(--acc-text);border-radius:999px;padding:.4rem .9rem;font-weight:600;font-size:13px;text-decoration:none}
.btnlink:hover{background:var(--soft)}
.inv{margin-top:4px}.actsrow{margin:14px 0 0}
.invites{border-color:var(--gold)}
.rule{flex-basis:100%;margin:2px 0 0}
/* Rooms */
.rooms{display:grid;gap:12px;margin-bottom:16px}
.room{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:12px 16px;align-items:center;box-shadow:var(--shadow)}
.room h3{margin:0}
.room .cap{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink);font-weight:600}
@media (max-width:600px){.room{grid-template-columns:minmax(0,1fr)}}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slot{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;background:var(--card);color:var(--ink);display:flex;flex-direction:column;gap:1px;min-height:66px;font-weight:400;font-size:14px;width:100%}
.slot .sn{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.slot .st{font-variant-numeric:tabular-nums;font-size:13px}
.slot .ss{font-size:12px;color:var(--mut);font-weight:600}
button.slot{border-color:var(--gold)}
button.slot .sn{color:var(--gold-ink)}
button.slot .ss{color:var(--ok-ink)}
button.slot:hover{background:var(--soft)}
.slot.sel,.slot.mine{background:var(--maroon);border-color:var(--maroon);color:#fff}
.slot.sel .sn,.slot.sel .ss,.slot.mine .sn,.slot.mine .ss{color:#F1E3CC}
button.slot.sel:hover{background:var(--maroon-deep)}
.slot.shut,.slot.full{background:var(--shut);color:var(--shut-ink);border-color:transparent}
.slot.shut .ss,.slot.full .ss{color:var(--shut-ink)}

.confirm{border:1.5px solid var(--gold);padding:0;overflow:hidden}
.confirm .hd{background:var(--maroon);color:#fff;padding:14px 18px;border-bottom:3px solid var(--gold)}
.confirm .hd .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#E9D6B3;font-weight:600}
.confirm .hd h3{color:#fff;margin:2px 0 0}
.confirm form{padding:16px 18px}
textarea{width:100%;max-width:32rem}
footer{color:var(--mut);font-size:12.5px;text-align:center;padding-block:0 28px}
@media (prefers-reduced-motion:no-preference){button{transition:background .12s,border-color .12s}}
</style></head><body>
<header class="brand"><div class="wrap">
  <a class="lockup" href="./" aria-label="Sexey's School practice room booking home"><img class="crest" src="assets/crest.png" alt=""><img class="wm" src="assets/wordmark.png" alt="Sexey's School"></a>
  <div class="acct"><span id="who"></span><button id="out" hidden>Log out</button></div>
</div></header>
<section class="band"><div class="wrap"><div class="eyebrow">Music Department</div><h1>Practice Room Booking</h1></div></section>
<main class="wrap"><div id="msg" role="status"></div><div id="app"><p class="mut">Loading…</p></div></main>
<footer>Sexey's School Music Department · Problems with a booking? Speak to a member of the Music staff.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Publishable (anon) key ONLY. Never put a service-role/secret key here.
const SB_URL='https://cukylemtaiogtfnwuwgq.supabase.co', SB_KEY='sb_publishable_u0vyX_4O8UIEHhSm-f3wmg_oT8bNymk';
const sb=supabase.createClient(SB_URL,SB_KEY);
// Only school email addresses may create an account (also enforced in the database by a trigger on auth.users).
const SCHOOL_DOMAIN='@sexeys.somerset.sch.uk';
const isSchoolEmail=e=>String(e||'').trim().toLowerCase().endsWith(SCHOOL_DOMAIN);
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SESS={break:'Break 11:05–11:25',lunch:'Lunch 12:25–13:15'}, DAYS=['','Mon','Tue','Wed','Thu','Fri'];
// Weekly limits: must match practice_check_booking in supabase/migrations/20261004_exam_students.sql
const WEEKLY_LIMIT=3, EXAM_LIMIT=4, EXAM={gcse:'GCSE',a_level:'A Level'};
const SN={break:['Break','11:05–11:25'],lunch:['Lunch','12:25–13:15']};
const schoolDay=d=>{d=new Date(d);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);return d};
let me=null, tab='book', sel=null, date=iso(schoolDay(new Date()));
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function flash(t,bad){const m=$('#msg');m.textContent=t||'';m.className=t?(bad?'err':'ok'):'';if(t)m.scrollIntoView({block:'nearest',behavior:'smooth'})}
const q=r=>{if(r.error)throw r.error;return r.data};
// Turn database refusals into messages a pupil can act on
const errText=e=>{const m=String(e?.message||e||''),c=e?.code;
  if(e?.status===504||/timeout|deadline|Failed to fetch|NetworkError|AuthRetryableFetchError/i.test(m+' '+(e?.name||'')))return'The booking system is taking too long to respond. Please wait a minute and try again. If it keeps happening, tell the Music Department.';
  if(/error sending confirmation|sending email/i.test(m))return'Your account could not be created because the confirmation email failed to send. Please tell the Music Department.';
  if(/already registered/i.test(m))return'An account with this email already exists. Try logging in instead.';
  if(/Invalid login credentials/i.test(m))return'That email or password is not right. Please check and try again.';
  if(c==='23505'&&/one_place_per_pupil/.test(m))return'You already have a booking in that session. Cancel it first if you want a different room.';
  if(c==='23505')return'Someone has just booked that slot. The timetable has been refreshed; please pick another.';
  if(c==='42501'||/row-level security/i.test(m))return'You can\'t do that yet. Your registration may still be waiting for staff approval.';
  if(c==='23514')return'That booking isn\'t allowed (bookings are for Break or Lunch on school days).';
  return m};
const fail=e=>{flash(errText(e),true);if(tab==='book'&&$('#view')&&(e?.code==='23505'||e?.code==='P0001')){sel=null;bookView().catch(()=>{})}};
const fd=d=>new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const wdOf=d=>(new Date(d+'T12:00').getDay()+6)%7+1;

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){me=null;$('#out').hidden=true;$('#who').textContent='';return authView()}
  try{me=q(await sb.from('profiles').select('*').eq('id',session.user.id).single())}catch(e){return fail(e)}
  $('#out').hidden=false;$('#who').textContent=me.full_name+(me.role==='staff'?' (staff)':me.exam_course?' · '+EXAM[me.exam_course]:'');
  if(me.role!=='staff'){
    if(!me.registered)return regView();
    if(me.rejected)return app.innerHTML='<div class="card"><h2>Registration not approved</h2><p>Please speak to a member of the Music Department.</p></div>';
    if(!me.approved)return app.innerHTML='<div class="card"><h2>Waiting for approval</h2><p>Your registration has been sent. You can book once staff approve it.</p></div>';
  }
  shell();
}
function shell(){
  const tabs=[['book','Book'],['mine','My bookings']];
  if(me.role!=='staff')tabs.push(['bands','My bands']);
  if(me.role==='staff')tabs.push(['regs','Registrations'],['sbands','Bands'],['all','All bookings'],['rules','Closures']);
  app.innerHTML=`<nav>${tabs.map(t=>`<button class="${t[0]===tab?'on':'alt'}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</nav><div id="view"></div>`;
  ({book:bookView,mine:mineView,bands:bandsView,regs:regsView,sbands:staffBandsView,all:allView,rules:rulesView})[tab]().catch(fail);
}
function authView(){
  app.innerHTML=`<div class="auth"><div class="logo"><img src="assets/logo.png" alt="Sexey's School, established 1891"></div>
  <div class="card"><h2>Log in</h2><form id="f-login"><label>School email<input name="email" type="email" required autocomplete="username"></label>
  <label>Password<input name="pw" type="password" required autocomplete="current-password"></label><button>Log in</button></form></div>
  <div class="card"><h2>New pupil? Create an account</h2><form id="f-signup"><label>Full name<input name="name" required autocomplete="name"></label>
  <label>School email (must end ${SCHOOL_DOMAIN})<input name="email" type="email" required placeholder="name${SCHOOL_DOMAIN}" pattern=".+@sexeys\.somerset\.sch\.uk" title="Use your ${SCHOOL_DOMAIN} school email address"></label><label>Password (8+ characters)<input name="pw" type="password" minlength="8" required autocomplete="new-password"></label><button>Create account</button></form>
  <p class="mut">After creating an account you will complete your induction, agree to the Practice Room Agreement and register, then wait for staff approval.</p></div></div>`;
}
function regView(){
  app.innerHTML=`<div class="card"><h2>Register to use the practice rooms</h2><form id="f-reg">
  <p><label><span><input type="checkbox" name="ind" required> I have completed the Music Department induction</span></label></p>
  <p><label><span><input type="checkbox" name="agr" required> I agree to the Practice Room Agreement</span></label></p>
  <div class="row"><label>Year group<input name="year" type="number" min="7" max="13" required></label><label>Your instrument(s)<input name="inst" required></label></div>
  <p class="mut">Everyone registers individually. Want to rehearse with others? Once you're approved, set up your band in <b>My bands</b> and invite your band-mates. Each of them needs their own account.</p>
  <p><button>Send registration</button></p></form></div>`;
}
async function bookView(){
  const v=$('#view'),wd=wdOf(date);
  const [res,wk,cl,sl,bands]=await Promise.all([sb.from('resources').select('*').order('sort'),sb.from('weekly_closures').select('*'),
    sb.from('closures').select('*').eq('closure_date',date),sb.rpc('get_slots',{d1:date,d2:date}),me.role==='staff'?{data:[]}:sb.rpc('my_bands')]);
  const R=q(res),W=q(wk),C=q(cl),S=q(sl),max=new Date();max.setDate(max.getDate()+28);
  const B=(q(bands)||[]).filter(b=>b.my_status==='accepted'&&b.ready); // bands this pupil can book for
  const staff=me.role==='staff', mon=new Date(date+'T12:00');mon.setDate(mon.getDate()-(wdOf(date)-1));
  const sun=new Date(mon);sun.setDate(sun.getDate()+6);
  const exam=!staff&&!!me.exam_course;
  // Counts own and band bookings, same rules as the database (practice_week_used)
  let usedN=0,lim=exam?EXAM_LIMIT:WEEKLY_LIMIT;if(!staff){const u=q(await sb.rpc('my_week_usage',{p_date:date}));usedN=u.used;lim=u.limit}
  const full=!staff&&usedN>=lim;
  const shut=(r,s)=>{const w=W.find(w=>(!w.resource_id||w.resource_id===r.id)&&w.weekday===wd&&(!w.session||w.session===s));
    const c=C.find(c=>(!c.resource_id||c.resource_id===r.id)&&(!c.session||c.session===s));return w?'Closed':c?(c.reason||'Closed'):null};
  const slot=(cls,s,status,attr='')=>attr?`<button class="slot ${cls}" ${attr}><span class="sn">${SN[s][0]}</span><span class="st">${SN[s][1]}</span><span class="ss">${status}</span></button>`
    :`<div class="slot ${cls}"><span class="sn">${SN[s][0]}</span><span class="st">${SN[s][1]}</span><span class="ss">${status}</span></div>`;
  const cell=(r,s)=>{const x=shut(r,s);if(wd>5)return slot('shut',s,'Weekend');if(x)return slot('shut',s,esc(x));
    const u=S.filter(b=>b.resource_id===r.id&&b.session===s),n=u.reduce((a,b)=>a+b.seats,0),on=sel&&sel.r===r.id&&sel.s===s?'sel':'';
    const pick=`data-pick="${r.id}|${s}" aria-label="Book ${esc(r.name)}, ${SN[s][0]} ${SN[s][1]}"`;
    if(r.id==='computers'&&u.some(b=>b.mine))return slot('mine',s,'Your booking');
    if(r.id==='computers'&&full&&!exam)return slot('full',s,'Weekly limit reached');
    if(r.id==='computers')return n>=r.capacity?slot('full',s,'Full'):slot(on,s,on?'Selected':`${r.capacity-n} of ${r.capacity} free`,pick);
    if(u.length)return u[0].mine?slot('mine',s,'Your booking'):slot('full',s,'Booked');
    if(full)return slot('full',s,'Weekly limit reached');
    return slot(on,s,on?'Selected':'Free',pick)};
  const nice=new Date(date+'T12:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  v.innerHTML=`<div class="card daybar"><div><div class="mut">Showing</div><div class="when">${nice}</div></div>
   <div class="ctl"><button class="alt" data-step="-1" aria-label="Previous school day" ${date<=iso(new Date())?'disabled':''}>&#8592;</button>
   <label class="sr" style="font-weight:600">Date<input type="date" id="d" value="${date}" min="${iso(new Date())}" max="${iso(max)}"></label>
   <button class="alt" data-step="1" aria-label="Next school day" ${date>=iso(max)?'disabled':''}>&#8594;</button></div></div>
  ${staff?'':`<div class="quota${full?' quota-full':''}" role="status"><div class="qbar">${Array.from({length:lim},(_,i)=>`<i class="${i<usedN?'on':''}"></i>`).join('')}</div>
   <div><strong>${usedN} of ${lim}</strong> ${exam?'practice sessions':'sessions'} booked for the week of ${mon.toLocaleDateString('en-GB',{day:'numeric',month:'long'})}${full?'. You can book again next week, or cancel an upcoming booking to free one up.':''}${exam?`<div class="mut">${EXAM[me.exam_course]} pupil: Music Tech computer bookings for coursework are unlimited and don't count.</div>`:''}</div></div>`}
  <div class="legend"><span><i class="sw free"></i>Free – tap to choose</span><span><i class="sw mine"></i>Yours or selected</span><span><i class="sw shut"></i>Booked or closed</span></div>
  ${sel?`<div class="card confirm"><div class="hd"><div class="eyebrow">Confirm booking</div><h3>${esc(R.find(r=>r.id===sel.r).name)} · ${nice} · ${SESS[sel.s]}</h3></div><form id="f-book" class="row">
   ${sel.r==='computers'?`<label>Places<input name="seats" type="number" min="1" max="16" value="1"></label><label>Purpose (required)<input name="purpose" required minlength="5" placeholder="e.g. GCSE composition coursework"></label>`:''}
   ${sel.r!=='computers'&&B.length?`<label>Who is using the room?<select name="band"><option value="">Just me</option>${B.map(b=>`<option value="${b.id}">My band: ${esc(b.name)}</option>`).join('')}</select></label>`:''}
   <button>Confirm booking</button><button type="button" class="alt" data-unpick="1">Cancel</button>
   ${sel.r!=='computers'?`<p class="mut rule">A booking for just you means only you may use the room. To rehearse with others, book as a band${B.length?'. A band booking uses one session from each member\'s weekly allowance.':`. Set one up in <b>My bands</b>.`}</p>`:''}</form></div>`:''}
  <div class="rooms">${R.map(r=>`<article class="room"><div><h3>${esc(r.name)}</h3>${r.capacity>1?`<div class="cap">${r.capacity} places</div>`:''}</div>
   <div class="slots">${cell(r,'break')}${cell(r,'lunch')}</div></article>`).join('')}</div>`;
}
async function mineView(){
  const staff=me.role==='staff';
  let qq=sb.from('bookings').select('*,resources(name)').gte('booking_date',iso(new Date())).order('booking_date').order('session');
  if(staff)qq=qq.eq('user_id',me.id); // pupils: the database returns their own and their bands' bookings

  $('#view').innerHTML=`<div class="card"><h2>My upcoming bookings</h2>${D.length?D.map(b=>`<div class="item"><span>${b.band_id?`<span class="badge">Band</span> `:''}${fd(b.booking_date)} · ${SESS[b.session]} · ${esc(b.resources.name)}${b.band_id?` · ${esc(bn[b.band_id]||'Band')}`:''}${b.resource_id==='computers'?` (${b.seats} place${b.seats>1?'s':''}: ${esc(b.purpose)})`:''}</span>
    ${b.user_id===me.id?`<button class="bad" data-cancel="${b.id}">Cancel</button>`:'<span class="mut">Booked by a band-mate</span>'}</div>`).join(''):'<p class="mut">Nothing booked yet.</p>'}</div>`;

async function allView(){
  const D=q(await sb.from('bookings').select('*,resources(name),profiles(full_name),bands(name)').gte('booking_date',iso(new Date())).order('booking_date'));
  $('#view').innerHTML=`<div class="card"><h2>All upcoming bookings</h2>${D.length?D.map(b=>`<div class="item"><span>${fd(b.booking_date)} · ${SESS[b.session]} · ${esc(b.resources.name)} · ${esc(b.profiles?.full_name)}${b.bands?' ('+esc(b.bands.name)+')':''}${b.purpose?' · '+esc(b.purpose):''}</span><button class="bad" data-cancel="${b.id}">Cancel</button></div>`).join(''):'<p class="mut">No bookings.</p>'}</div>`;
}
async function regsView(){
  const P=q(await sb.from('profiles').select('*').eq('role','pupil').eq('registered',true).order('created_at',{ascending:false}));
  const examSel=p=>`<label class="exam">Exam course<select data-exam="${p.id}" aria-label="Exam course for ${esc(p.full_name)}"><option value="">None</option>${Object.entries(EXAM).map(([k,l])=>`<option value="${k}" ${p.exam_course===k?'selected':''}>${l}</option>`).join('')}</select></label>`;
  const row=p=>`<div class="item"><span>${p.exam_course?`<span class="badge">${EXAM[p.exam_course]}</span> `:''}<b>${esc(p.full_name)}</b> · Y${p.year_group} · ${esc(p.instruments)}</span>
   <span class="acts">${p.approved?`${examSel(p)}<button class="alt" data-appr="${p.id}|0">Revoke</button>`:`<button data-appr="${p.id}|1">Approve</button> <button class="bad" data-rej="${p.id}">Reject</button>`}</span></div>`;
  const pend=P.filter(p=>!p.approved&&!p.rejected),ok=P.filter(p=>p.approved),rej=P.filter(p=>p.rejected);
  $('#view').innerHTML=`<div class="card"><h2>Awaiting approval (${pend.length})</h2>${pend.map(row).join('')||'<p class="mut">None.</p>'}</div>
  <div class="card"><h2>Approved (${ok.length})</h2>${ok.map(row).join('')||'<p class="mut">None.</p>'}</div>
  <div class="card"><h2>Rejected (${rej.length})</h2>${rej.map(p=>row(p).replace(/<button data-rej.*?<\/button>/,'')).join('')||'<p class="mut">None.</p>'}</div>`;
}
// ----- Bands -----
const SITE=location.origin+location.pathname;
function inviteMail(band,email){
  const sub=`Join my band "${band}" on the Sexey's practice room booking`;
  const body=`Hi,\n\nI've added you to my band "${band}" on the Sexey's School Music Department practice room booking site, so we can book rooms to rehearse together.\n\n1. Go to ${SITE}\n2. Create an account with this school email address (${email})\n3. Complete the registration and wait for a member of staff to approve you\n4. Open "My bands" and accept the invitation\n\nThanks,\n${me.full_name}`;
  return `mailto:${email}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`;
}
function memberState(m){
  if(m.is_lead)return['ok','Leader'];
  if(m.status==='accepted')return['ok','Accepted'];
  if(!m.has_account)return['wait','Invited · no account yet'];
  if(!m.approved)return['wait','Invited · account awaiting approval'];
  return['wait','Invited · needs to accept'];
}
async function bandsView(){
  const all=q(await sb.rpc('my_bands'))||[];
  const invites=all.filter(b=>b.my_status==='invited'), bands=all.filter(b=>b.my_status==='accepted');
  const card=b=>{const waiting=b.members.filter(m=>!(m.status==='accepted')).length;
    return `<article class="card bandcard"><div class="bandhd"><div><h2>${esc(b.name)}</h2><div class="mut">Led by ${esc(b.lead_name)}</div></div>
      <span class="pill ${b.ready?'ok':'wait'}">${b.ready?'Ready to book':b.members.length<2?'Needs at least 2 members':`Waiting for ${waiting} member${waiting>1?'s':''}`}</span></div>
      <ul class="members">${b.members.map(m=>{const [k,t]=memberState(m);
        return `<li><span class="mname"><b>${esc(m.name||m.email)}</b>${m.instrument?` · ${esc(m.instrument)}`:''}${!m.has_account||m.name===m.email?'':`<span class="mut"> · ${esc(m.email)}</span>`}</span>
        <span class="acts"><span class="pill ${k}">${t}</span>
        ${b.is_lead&&!m.has_account?`<a class="btnlink" href="${esc(inviteMail(b.name,m.email))}">Email invite</a>`:''}
        ${b.is_lead&&!m.is_lead?`<button class="bad" data-rmm="${m.id}" data-nm="${esc(m.name||m.email)}">Remove</button>`:''}</span></li>`}).join('')}</ul>
      ${b.is_lead?`<form class="row inv" id="f-inv" data-band="${b.id}" data-bname="${esc(b.name)}"><label>Band-mate's school email<input name="email" type="email" required placeholder="name${SCHOOL_DOMAIN}"></label>
        <label>Their instrument<input name="inst" placeholder="e.g. Bass"></label><button>Invite</button></form>
        <p class="actsrow"><button class="bad" data-delband="${b.id}" data-nm="${esc(b.name)}">Delete band</button></p>`
      :`<p class="actsrow"><button class="alt" data-leave="${b.members.find(m=>m.status==='accepted'&&!m.is_lead&&m.email===String(me.email||'').toLowerCase())?.id||''}" data-nm="${esc(b.name)}">Leave band</button></p>`}
    </article>`};
  $('#view').innerHTML=`<div class="card intro"><h2>Bands</h2><p>To rehearse with other people, book as a band. Every member needs their own approved account and must accept the invitation, so everyone has agreed to the Practice Room Agreement. A booking for just you means only you may use the room.</p></div>
  ${invites.length?`<div class="card invites"><h2>Invitations</h2>${invites.map(b=>{const mine=b.members.find(m=>m.email===String(me.email||'').toLowerCase());
    return `<div class="item"><span><b>${esc(b.lead_name)}</b> invited you to join <b>${esc(b.name)}</b>${mine?.instrument?` on ${esc(mine.instrument)}`:''}</span>
    <span class="acts"><button data-accept="${b.id}">Accept</button><button class="alt" data-decline="${b.id}">Decline</button></span></div>`}).join('')}</div>`:''}
  ${bands.map(card).join('')}
  <div class="card"><h2>Start a band</h2><form id="f-band" class="row"><label>Band name<input name="name" required minlength="2" maxlength="40"></label>
   <label>Your instrument<input name="inst" placeholder="e.g. Guitar"></label><button>Create band</button></form>
   <p class="mut">You'll be the leader. Then invite your band-mates by their school email.</p></div>`;
}
async function staffBandsView(){
  const B=q(await sb.rpc('staff_bands'))||[];
  $('#view').innerHTML=`<div class="card"><h2>Bands (${B.length})</h2>${B.length?B.map(b=>`<div class="item"><span><b>${esc(b.name)}</b> · led by ${esc(b.lead_name)}
    <span class="pill ${b.ready?'ok':'wait'}">${b.ready?'Ready':'Not ready'}</span><br><span class="mut">${(b.members||[]).map(m=>`${esc(m.name)}${m.instrument?' ('+esc(m.instrument)+')':''}${m.status==='accepted'?'':!m.has_account?' – no account yet':' – invited'}`).join(', ')}</span></span>
    <button class="bad" data-delband="${b.id}" data-nm="${esc(b.name)}">Delete band</button></div>`).join(''):'<p class="mut">No bands yet. Pupils create them from their own My bands tab.</p>'}</div>`;
}
async function rulesView(){
  const [r,w,c]=await Promise.all([sb.from('resources').select('id,name').order('sort'),sb.from('weekly_closures').select('*').order('weekday'),sb.from('closures').select('*').order('closure_date')]);
  const R=q(r),W=q(w),C=q(c),nm=id=>id?R.find(x=>x.id===id)?.name:'Whole department';
  const opts='<option value="">Whole department</option>'+R.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
  const ses='<option value="">All day</option><option value="break">Break</option><option value="lunch">Lunch</option>';
  $('#view').innerHTML=`<div class="card"><h2>Exceptional closures</h2><form id="f-clo" class="row"><label>Space<select name="r">${opts}</select></label>
  <label>Date<input type="date" name="d" required></label><label>Session<select name="s">${ses}</select></label><label>Reason<input name="why"></label><button>Add closure</button></form>
  ${C.map(x=>`<div class="item"><span>${x.closure_date} · ${esc(nm(x.resource_id))} · ${x.session||'All day'} · ${esc(x.reason)}</span><button class="bad" data-delc="${x.id}">Remove</button></div>`).join('')}</div>
  <div class="card"><h2>Weekly closures</h2><form id="f-wk" class="row"><label>Space<select name="r">${opts}</select></label>
  <label>Day<select name="wd">${[1,2,3,4,5].map(i=>`<option value="${i}">${DAYS[i]}</option>`).join('')}</select></label><label>Session<select name="s">${ses}</select></label><button>Add rule</button></form>
  ${W.map(x=>`<div class="item"><span>${esc(nm(x.resource_id))} · ${DAYS[x.weekday]} · ${x.session||'All day'}</span><button class="bad" data-delw="${x.id}">Remove</button></div>`).join('')}</div>`;
}

document.addEventListener('submit',async e=>{
  e.preventDefault();const id=e.target.id,f=Object.fromEntries(new FormData(e.target));flash('');
  const btn=e.submitter||e.target.querySelector('button:not([type=button])'),label=btn?.textContent;
  if(btn?.disabled)return;
  if(btn){btn.disabled=true;btn.textContent=({'f-login':'Logging in…','f-signup':'Creating account…','f-reg':'Sending…','f-book':'Booking…','f-band':'Creating…','f-inv':'Inviting…'})[id]||'Saving…'}
  try{
    if(id==='f-login'){q(await sb.auth.signInWithPassword({email:f.email,password:f.pw}));boot()}
    else if(id==='f-signup'){
      if(!isSchoolEmail(f.email))throw new Error('Accounts can only be created with a '+SCHOOL_DOMAIN+' email address.');
      const r=q(await sb.auth.signUp({email:f.email.trim(),password:f.pw,options:{data:{full_name:f.name.trim()}}}));
      if(r.session)boot();else flash('Account created. Check your email to confirm it, then log in.')}
    else if(id==='f-reg'){
      q(await sb.from('profiles').update({registered:true,reg_type:'individual',year_group:+f.year,instruments:f.inst,induction_done:true,agreement_signed:true}).eq('id',me.id));
      boot()}
    else if(id==='f-book'){
      const R=sel.r;q(await sb.from('bookings').insert({resource_id:R,booking_date:date,session:sel.s,user_id:me.id,
        seats:R==='computers'?+f.seats:1,purpose:R==='computers'?f.purpose.trim():null,band_id:f.band?+f.band:null}));
      sel=null;flash(f.band?'Booked for your band. It now shows in each member\'s bookings.':'Booked.');bookView()}
    else if(id==='f-band'){q(await sb.rpc('band_create',{p_name:f.name,p_instrument:f.inst||null}));flash(`Band "${f.name.trim()}" created. Now invite your band-mates.`);bandsView()}
    else if(id==='f-inv'){const bandId=+e.target.dataset.band,bname=e.target.dataset.bname,email=f.email.trim().toLowerCase();
      const r=q(await sb.rpc('band_invite',{p_band:bandId,p_email:email,p_instrument:f.inst||null}));
      await bandsView();
      flash(!r.has_account?`Invited ${email}. They don't have an account yet: use "Email invite" to send them the link.`:!r.approved?`Invited ${email}. They can accept once staff approve their account.`:`Invited ${email}. They'll see the invitation in My bands.`)}
    else if(id==='f-clo'){q(await sb.from('closures').insert({resource_id:f.r||null,closure_date:f.d,session:f.s||null,reason:f.why}));rulesView()}
    else if(id==='f-wk'){q(await sb.from('weekly_closures').insert({resource_id:f.r||null,weekday:+f.wd,session:f.s||null}));rulesView()}
  }catch(err){fail(err)}
  finally{if(btn&&btn.isConnected){btn.disabled=false;btn.textContent=label}}
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;flash('');
  try{
    if(d.tab){tab=d.tab;sel=null;shell()}
    else if(d.pick){const[r,s]=d.pick.split('|');sel={r,s};bookView()}
    else if(d.unpick){sel=null;bookView()}
    else if(d.step){const x=new Date(date+'T12:00'),k=+d.step;do{x.setDate(x.getDate()+k)}while(x.getDay()===0||x.getDay()===6);
      const t=new Date();t.setHours(0,0,0,0);const m=new Date();m.setDate(m.getDate()+28);if(x<t||x>m)return;date=iso(x);sel=null;await bookView()}
    else if(d.cancel){if(confirm('Cancel this booking?')){q(await sb.from('bookings').delete().eq('id',d.cancel));flash('Booking cancelled.');shell()}}
    else if(d.appr){const[i,v]=d.appr.split('|');q(await sb.from('profiles').update({approved:v==='1',rejected:false}).eq('id',i));regsView()}
    else if(d.rej){q(await sb.from('profiles').update({rejected:true,approved:false}).eq('id',d.rej));regsView()}
    else if(d.accept){q(await sb.rpc('band_respond',{p_band:+d.accept,p_accept:true}));flash('You\'ve joined the band.');bandsView()}
    else if(d.decline){if(confirm('Decline this band invitation?')){q(await sb.rpc('band_respond',{p_band:+d.decline,p_accept:false}));flash('Invitation declined.');bandsView()}}
    else if(d.rmm){if(confirm(`Remove ${d.nm} from the band?`)){q(await sb.rpc('band_remove',{p_member:+d.rmm}));flash(`${d.nm} removed.`);bandsView()}}
    else if(d.leave){if(confirm(`Leave ${d.nm}?`)){q(await sb.rpc('band_remove',{p_member:+d.leave}));flash(`You've left ${d.nm}.`);bandsView()}}
    else if(d.delband){if(confirm(`Delete ${d.nm}? Its upcoming bookings will be cancelled.`)){q(await sb.rpc('band_delete',{p_band:+d.delband}));flash(`${d.nm} deleted.`);tab==='sbands'?staffBandsView():bandsView()}}
    else if(d.delc){q(await sb.from('closures').delete().eq('id',d.delc));rulesView()}
    else if(d.delw){q(await sb.from('weekly_closures').delete().eq('id',d.delw));rulesView()}
  }catch(err){fail(err)}
});
document.addEventListener('change',e=>{
  if(e.target.id==='d'){date=e.target.value||date;sel=null;bookView().catch(fail)}
  if(e.target.dataset.exam){const el=e.target,v=el.value||null;el.disabled=true;flash('');
    sb.from('profiles').update({exam_course:v}).eq('id',el.dataset.exam).then(r=>{if(r.error)throw r.error;
      flash(v?`Marked as ${EXAM[v]}: 4 sessions a week and unlimited computer bookings.`:'Exam course removed: back to 3 sessions a week.');return regsView()}).catch(fail).finally(()=>{el.disabled=false})}
});
$('#out').onclick=async()=>{await sb.auth.signOut();tab='book';boot()};
boot();
</script></body></html>
